[build-system]
requires = ["setuptools>=40.6.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "janus"
version = "1.0.0"
description = "Janus"
authors = [{name = "DeepSeek-AI"}]
license = {file = "LICENSE-CODE"}
urls = {homepage = "https://github.com/deepseek-ai/Janus"}
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "transformers==4.48.2",
    "timm==0.9.16",
    "accelerate==1.3.0",
    "sentencepiece==0.2.1",
    "attrdict3==2.0.2",
    "einops==0.8.0",
]

[project.optional-dependencies]
gradio = [
    "gradio==5.20.0",
    "gradio-client==1.7.2",
    "spaces==0.32.0",
    "opencv-python-headless==4.11.0.86",
    "matplotlib==3.10.0",
    "pillow==11.1.0",
    "pydantic==2.10.6",
]
lint = [
    "isort",
    "black[jupyter] >= 22.6.0",
    "pylint[spelling] >= 2.15.0",
    "flake8",
    "flake8-bugbear",
    "flake8-comprehensions",
    "flake8-docstrings",
    "flake8-pyi",
    "flake8-simplify",
    "ruff",
    "pyenchant",
    "pre-commit",
]

[tool.setuptools]
packages = {find = {exclude = ["images"]}}
